schema_version: 1
deferred_cleanup:
- Daily Workbench is the selected desktop direction; the React member shell now uses its navigation pattern. The
  three concept previews remain standalone and in-memory.
- The live training tables, RLS, and activation RPC passed rolled-back authenticated SQL checks. A signed-in member/expert
  browser pass still needs an approved expert and confirmed booking; the current Supabase project has one profile
  and no expert profiles or bookings.
- The three role shells have shareable paths; pages and training filters within a shell remain in history state rather than shareable URLs.
- The old src/App.tsx browser-storage walkthrough remains as unmounted reference code; remove or extract its fixtures after connected QA no longer needs them.
- The feature search opens Training but does not deep-link into a specific member program or exercise; selecting
  a program is required before adding an exercise.
- The static exercise catalog loads 1324 English text records at once; add list virtualization or server-side search
  if lower-end devices show lag. Flow SVG frames are imported separately from the original dataset media.
- Admin signed-in overview was confirmed by the first admin; member and expert live actions still need a signed-in
  browser pass.
- Supabase Auth leaked-password protection is disabled; the security advisor warns about it and Supabase documents
  it as a Pro-plan feature.
- Checkout and orders are simulated; real provider authorization, webhooks, reconciliation, fulfilment, and payout
  transfer require product decisions.
- Live attachment browser QA still needs an approved expert and confirmed booking; the project has no confirmed bookings. The private bucket, columns, policies, and local member/expert flow were verified.
- Release 2 and later spec features such as calls, media uploads outside booking messages, calendar sync, notification delivery, advanced
  nutrition search, analytics, and content automation are not implemented.
- The live client loads all RLS-visible rows per table on refresh; add pagination and focused queries for larger
  datasets.
- Live Circle member and approved-expert browser QA needs additional signed-in test accounts; this project currently
  has only the first admin and no approved expert. SQL, RLS, and local demo checks are complete.
- Flow Exercise Dataset previews are imported for 1257 exercises. Its NOTICE reports incomplete generation prompts,
  third-party rights uncertainty, and unreviewed AI-generated form. Complete a human rights and movement-accuracy
  review before relying on the artwork for coaching or public release; 67 exercises remain instructions-only.
