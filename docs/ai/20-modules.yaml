schema_version: 1
modules:
  brand:
    owner_module: brand
    allowed_edit_paths: [tokens.css, app/focus-circle.css, app/globals.css, app/layout.tsx, public/brand/, public/landing/, next.config.ts]
    must_not_move_without: [workspace_shell, public_site]
  public_site:
    owner_module: public_site
    allowed_edit_paths: [app/page.tsx, next.config.ts, public/landing/, public/robots.txt, public/sitemap.xml]
    must_not_move_without: [brand]
  hosting:
    owner_module: hosting
    allowed_edit_paths: [vercel.json, next.config.ts, CUTOVER.md]
    must_not_move_without: [public_site, authentication, database]
  workspace_shell:
    owner_module: workspace_shell
    allowed_edit_paths: [app/(workspace)/layout.tsx, app/components/workspace-shell.tsx, app/components/workspace-ui.tsx, proxy.ts]
    must_not_move_without: [authentication, data_access]
  authentication:
    owner_module: authentication
    allowed_edit_paths: [app/auth/, lib/supabase/, proxy.ts]
    must_not_move_without: [workspace_shell, database]
  member_and_social:
    owner_module: member_and_social
    allowed_edit_paths: [app/(workspace)/, app/components/, lib/fitcircle-data.ts, lib/preview-data.ts]
    must_not_move_without: [database, authentication]
  database:
    owner_module: database
    allowed_edit_paths: [supabase/config.toml, supabase/migrations/, supabase/seeds/, lib/database.types.ts, tests/]
    must_not_move_without: [authentication, data_access, legacy_archive]
  data_access:
    owner_module: data_access
    allowed_edit_paths: [lib/, app/*-actions.ts, app/(workspace)/]
    must_not_move_without: [database, authentication]
  legacy_archive:
    owner_module: legacy_archive
    allowed_edit_paths: [legacy/healthy-life-vite/]
    must_not_move_without: [database]
