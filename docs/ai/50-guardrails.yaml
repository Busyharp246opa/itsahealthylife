schema_version: 1
invariants:
  - Keep Healthy Life logo, Host/Bricolage typography, plum/lime/lavender/warm-white palette, and public landing identity.
  - Do not restore FitLoop or the TDEE calculator in routes, navigation, schema, or tests.
  - Never expose SUPABASE_SERVICE_ROLE_KEY to the browser.
  - Preserve hosted Auth users and original data through healthy_legacy archival before new public schema creation.
  - Do not treat demo checkout, currency, notifications, or scheduling previews as production integrations.
  - RLS and server authorization must guard saved data regardless of client presentation.
blast_radius:
  brand: [public_entry, member]
  routing: [public_entry, member, auth_and_roles]
  auth: [auth_and_roles, saved_data, legacy_migration]
  migrations: [saved_data, legacy_migration, auth_and_roles]
must_retest_if_changed:
  - paths: [app/auth/]
    flows: [public_entry, auth_and_roles]
  - paths: [next.config.ts, app/page.tsx, public/landing/, tokens.css, app/focus-circle.css]
    flows: [public_entry, member]
  - paths: [app/(workspace)/, app/components/, lib/]
    flows: [member, auth_and_roles, saved_data]
  - paths: [supabase/migrations/, supabase/config.toml, lib/supabase/]
    flows: [saved_data, legacy_migration, auth_and_roles]
refactor_rules:
  - Edit helpers and data access first, route wiring second, docs last.
  - Keep the archived Vite runtime separate from the Next.js build.
  - Keep Vercel framework and output settings aligned with Next.js; check the production build and environment before hosted schema cutover.
