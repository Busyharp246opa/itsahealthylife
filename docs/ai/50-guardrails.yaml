schema_version: 1
guardrails:
- id: desktop_concept_isolation
  rule: Sample UI/ is a member/expert design review area. Keep its state local to the page, label sample data, and
    preserve the shipped mobile and existing admin UI while comparing directions. Keep hosted samples noindex.
- id: landing_sample_boundary
  rule: The approved landing design is now the public root and /about; keep the Sample UI copy noindex. Hero copy and account actions must be visible on first paint. Registration and login CTAs must resolve to the correct member or expert shell and account form. Trainers still require application and approval; do not imply real charges or mobile app-store availability.
- id: no_secrets
  rule: Keep OAuth tokens, passwords, and service keys out of source, docs, logs, and browser bundles. Only publishable
    credentials may enter Vite.
- id: production_origin
  rule: Vercel Production may embed only the Supabase project URL and publishable key. Keep platform-api CORS limited to the verified production host and local development; do not allow arbitrary origins. Preserve JWT verification and role checks.
- id: role_boundaries
  rule: Browser cannot grant roles or directly change booking, payment, payout, approval, or policy state. Server
    actions derive actor from JWT and check grants. Challenge and product visibility changes also require an admin role on the server and must be audited.
- id: expert_review
  rule: Credential and price changes create a submitted review; direct authenticated expert_profiles updates are
    revoked.
- id: booking_integrity
  rule: A slot has at most one active booking and booked slots are hidden from member discovery; booking/payment/payout
    are separate states; cancellation uses booked policy version.
- id: health_privacy
  rule: Member health rows require explicit consent, are self-only unless sharing is enabled for a booked expert,
    and can be removed by the member; admin cannot browse them by default.
- id: training_privacy
  rule: Members own and write their training programs, set logs, and completed sessions. A program can be shared
    only with a confirmed or completed booked expert; expert reads require that booking to remain eligible and the
    explicit per-program share choice. Experts cannot edit member training. Only one program per member is active.
    Never copy FitCircle's separately licensed exercise images or GIFs into the catalog. Flow artwork must retain source, license, NOTICE, and provenance; label it illustrative because generation prompts and form review are incomplete.
- id: browser_navigation
  rule: The pathname selects /member, /experts, or /admin, with optional trailing slash normalized to the same shell; browser history stores only navigation and catalog filter state. Back/Forward must restore the page and nested training location within that shell without exposing protected data or changing authorization. Member/admin grants and expert approval must be checked after loading or restoring a route. Keep the admin console's sidebar and panel structure.
- id: live_shell_access
  rule: The public entrypoint mounts only the connected app. Do not render the demo role/mode switch. A URL or history state cannot grant admin or expert access; unapproved experts see only their application. Keep a visible sign-out path in each shell.
- id: auth_email_returns
  rule: Confirmation and recovery links must return to exact production member, expert, or admin shell URLs allowed by Supabase Auth. Never include tokens in source, docs, logs, or navigation state. Keep public signup off the admin shell, and handle password recovery before rendering workspace content.
- id: feature_search_roles
  rule: Command search only lists current-role destinations. Route keys must exist in the corresponding demo or
    connected workspace, and search must not change authorization or reveal other roles. Keep the member desktop trigger above Your workspace, preserve its mobile access, and keep the admin trigger in its sidebar above Overview. Expert placement is unchanged.
- id: messaging_privacy
  rule: Booking conversation messages and private attachments are visible only to participants while the booking is confirmed. Storage paths bind the conversation and sender. Keep upload and download behind RLS; never use public URLs. Preserve message-only sends and allow file-only sends.
- id: product_image_access
  rule: Product images are public shop assets, unlike private booking attachments. Only an authenticated admin may upload or delete them. Keep bucket MIME and size limits, the five-image product cap, product-scoped paths, and server-side path verification. Never expose the service key in the browser.
- id: daily_tracking_data
  rule: Track totals are derived from today's visible member records. Keep quick entry writes within existing member-owned demo or Supabase paths, and clear form fields only after a successful write. Preserve the admin and expert layouts.
- id: simulation_honesty
  rule: UI identifies payments and orders as simulated; do not display real charge or payout claims.
- id: architecture_alignment
  rule: Update affected YAMLs and project-structure.txt after changing implementation or boundaries.
- id: circle_privacy
  rule: Keep member and approved-expert Circle feeds separate in RLS, not only in the UI. Posts, comments, likes,
    reports, and blocks require a visible parent or actor ownership. Admin moderation keeps the existing admin navigation
    and visual kit.
