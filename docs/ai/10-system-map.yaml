schema_version: 1
runtime:
  framework: Next.js 16 App Router with React 19 and Supabase
  entrypoints:
    public: app/page.tsx and next.config.ts rewrite to public/landing/index.html
    about: next.config.ts rewrite to public/landing/about.html
    application: app/(workspace)/layout.tsx
    authentication: app/auth/ and proxy.ts
  data:
    server_client: lib/supabase/server.ts
    browser_client: lib/supabase/client.ts
    service_client: lib/supabase/admin.ts
    queries: lib/fitcircle-data.ts and focused lib/ modules
    schema: supabase/migrations/
    seeds: supabase/seeds/
  brand:
    tokens: tokens.css
    workspace_styles: app/globals.css and app/focus-circle.css
    assets: public/brand/ and public/landing/assets/
load_order_contracts:
  - The archive migration runs before the imported core migration on a hosted cutover.
  - Imported migrations run by filename order; the legacy data mapping migration runs last.
  - On local reset, migrations run before exercise and demo seeds; legacy exercises absent from catalog become custom trainee exercises.
  - Next.js layouts and proxy enforce session entry; database RLS remains the authority for saved data.
  - Landing rewrite targets static public/landing files and must not shadow workspace routes.
  - Legacy /member and /experts links redirect to the new trainee and trainer entry routes.
