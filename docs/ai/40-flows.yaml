schema_version: 1
flows:
  public_entry:
    paths: ['/', /about, /auth/login, /auth/register/trainee, /auth/register/trainer]
    manual_smoke_checks:
      - Open landing and About on desktop and phone; verify logo, colors, and registration links.
      - Open the landing route from the login page and the trainee home; verify full navigation succeeds without a failed RSC prefetch.
      - Open login and both registration routes; verify branding and Supabase connection.
      - Open old /member and /experts bookmarks; verify they reach the new trainee and trainer entry routes.
  member:
    paths: [/trainee, /trainee/dashboard, /today, /circle, /train, /wellness, /store]
    manual_smoke_checks:
      - Confirm the sidebar wordmark has no icon box or outline beside the Healthy Life mark on desktop and phone.
      - Check the trainee home in Chrome for failed application requests after a fresh navigation.
      - Open member home, dashboard, Circle, exercise catalog, wellness, and store.
      - Confirm FitLoop and TDEE routes return 404 and no navigation points to them.
  auth_and_roles:
    paths: [/trainer, /admin, /auth/admin]
    manual_smoke_checks:
      - Confirm the login field has no length cap, then sign in with an existing account using its full password.
      - Confirm new account registration still applies its eight-character password rule.
      - Guest trainer and admin routes lead to the appropriate sign-in page.
      - Signed member cannot access trainer or operator data; existing admin retains operator access after cutover.
    hosted_status: Existing member sign-in reached /trainee on 2026-10-30; operator access and cross-role restrictions remain unverified in the hosted browser.
  saved_data:
    paths: [supabase/migrations/, tests/new-flow-rls.test.mjs, tests/trainer-plan-rls.test.mjs]
    manual_smoke_checks:
      - Run local database reset and the full RLS test suite.
      - Confirm owner-scoped social, training, wellness, message, and support data.
  legacy_migration:
    paths: [supabase/migrations/20260717175900_archive_healthy_life_legacy.sql, supabase/migrations/20261030120000_migrate_healthy_life_legacy.sql]
    manual_smoke_checks:
      - Rehearse archive and mapping against a representative old schema locally.
      - Compare hosted pre-cutover counts with archived and mapped post-cutover counts.
      - Verify original Auth user IDs and sign-in, including admin role, remain intact.
