schema_version: 1
project: Its A Healthy Life
status: nextjs_hosted_cutover_complete
timezone: Asia/Dhaka
read_order:
  - 00-index.yaml
  - 05-admin.yaml
  - 10-system-map.yaml
  - 30-contracts.yaml
  - 20-modules.yaml
  - 40-flows.yaml
  - 50-guardrails.yaml
  - 60-debt.yaml
summary: >-
  Next.js App Router implementation adapted from FitCircle. The public landing
  and About pages use the original Healthy Life identity; workspaces provide
  member, trainer, social, training, wellness, commerce preview, and operator
  routes. FitLoop and the TDEE calculator are excluded. The prior Vite app and
  its original AI docs remain in legacy/healthy-life-vite/. The hosted Supabase
  project runs the new schema, with original accounts and rows preserved in the
  legacy archive and mapped into the new model.
task_routing:
  brand_and_public_site:
    owner: app/layout.tsx, app/components/workspace-shell.tsx, app/auth/layout.tsx, next.config.ts, tokens.css, app/focus-circle.css, public/brand/, public/landing/
    read: [20-modules.yaml, 40-flows.yaml, 50-guardrails.yaml]
  workspace:
    owner: app/(workspace)/, app/components/, lib/
    read: [20-modules.yaml, 30-contracts.yaml, 40-flows.yaml, 50-guardrails.yaml]
  database_and_migration:
    owner: supabase/migrations/, supabase/seeds/, lib/supabase/, tests/
    read: [05-admin.yaml, 20-modules.yaml, 30-contracts.yaml, 40-flows.yaml, 50-guardrails.yaml]
  hosting_and_cutover:
    owner: vercel.json, next.config.ts, CUTOVER.md
    read: [05-admin.yaml, 20-modules.yaml, 30-contracts.yaml, 40-flows.yaml, 50-guardrails.yaml]
  previous_app:
    owner: legacy/healthy-life-vite/
    read: [legacy/healthy-life-vite/docs/ai/00-index.yaml]
