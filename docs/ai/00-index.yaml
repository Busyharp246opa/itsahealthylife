summary: The approved public landing page opens at /, with an About page at /about. Responsive member, expert, and admin clients share a Supabase backend at /member, /experts, and /admin.
  The role entrypoint mounts the connected client only; the old browser-storage demo remains as reference code.
  Members author weekly training programs, track sets, and optionally share with booked experts. Checkout
  and orders are simulated. Three standalone member/expert desktop concept previews and a public landing-page sample live in Sample UI/; Daily Workbench
  training informs the member desktop app. Members open programs, browse and filter the full exercise catalog, review
  technique, and add movements to a selected day. Role-scoped command search navigates member, expert, and admin
  features; admin search sits in the sidebar above Overview, overview and payment metric cards use complete layouts, and logout is visible below navigation. Admin Challenges and Store show item lists first, with creation forms opened on demand; they can toggle publication status. Admin Support uses separate compact request, report, and Circle settings views. Browser Back and Forward follow pages within the selected shell and the nested training browser. Circle now has member topic rooms and a separate approved-expert
  feed, with posts, kinds, likes, comments, safety actions, people views, guidelines, and admin moderation. Exercise
  detail has top and bottom Back controls. Flow SVG previews cover 1,257 exercises; 67 have instructions only. Preview motion is illustrative and can be paused.
  Booking messages support one private image or document attachment per message.
  Member Track uses a compact daily check-in with side-by-side totals, quick meal/activity entry, optional macros, and one-click repeat from today's log.
  The production Vite build is served from itsahealthylife.vercel.app with browser-safe Supabase variables set in Vercel Production.
